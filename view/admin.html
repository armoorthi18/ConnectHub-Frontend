<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectHub Admin Dashboard</title>

    <link rel="stylesheet" href="../style/style.css">

    <style>
        .admin-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #2563eb;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="admin-container">

    <a href="status.html" class="back-btn">
        ← Back to Home
    </a>

    <div class="admin-header">
        <h1>ConnectHub Admin Dashboard</h1>
    </div>

    <div class="stats-grid">

        <div class="stat-card">
            <h3>Total Users</h3>
            <div id="totalUsers" class="stat-number">0</div>
        </div>

        <div class="stat-card">
            <h3>Total Posts</h3>
            <div id="totalPosts" class="stat-number">0</div>
        </div>

        <div class="stat-card">
            <h3>Total Achievements</h3>
            <div id="totalAchievements" class="stat-number">0</div>
        </div>

    </div>

</div>

<script src="../js/admin.js"></script>

</body>
</html>
