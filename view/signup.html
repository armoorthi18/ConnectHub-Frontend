<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ConnectHub Signup</title>

    <link rel="stylesheet"
          href="../style/style.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>ConnectHub</h1>

        <p>Employee Signup</p>

        <form id="signupForm">

            <input type="text"
                   id="fullName"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   id="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   id="password"
                   placeholder="Password"
                   required>

            <button type="submit">

                Register

            </button>

            <p id="message"></p>

        </form>

    </div>

</div>

<script src="../js/signup.js"></script>

</body>
</html>
